name: Deploy SPA to Cloudflare Pages

# Builds the SPA and publishes it (plus the functions/ proxy) to the direct-upload Pages
# project `fennec-spa` on every push to main. The Pages project, its runtime env vars
# (BACKEND_URL, PROXY_SECRET), and the custom domain are provisioned by Terraform.
#
# Required repo config:
#   secrets.CLOUDFLARE_API_TOKEN   - token with Account > Cloudflare Pages > Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
#   vars.REACT_APP_GOOGLE_CLIENT_ID - public Google OAuth client id (must match server)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          # Empty origin -> same-origin /api calls through the Cloudflare proxy.
          SERVER_URL: ""
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
        run: yarn build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name=fennec-spa --branch=main
